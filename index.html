<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Phiếu Thu Cũ</title>
<style>
  :root{--blue:#1a73e8;--bg:#f4f6f8;--card:#fff;--border:#e0e3e7;--text:#1f2937;--muted:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:360px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden}
  .head{background:var(--blue);color:#fff;padding:10px 14px;text-align:center}
  .head h1{font-size:13px;font-weight:700;letter-spacing:.3px}
  .body{padding:14px}
  label{font-size:11px;font-weight:600;display:block;margin-bottom:5px}
  label span{color:#d93025}
  .input-row{display:flex;gap:6px}
  input[type=text]{flex:1;padding:7px 10px;border:1.2px solid var(--border);border-radius:7px;font-size:12.5px;outline:none;background:#fff}
  input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,115,232,.12)}
  input::placeholder{color:#9ca3af;font-size:12px}
  .btn-clear{flex:0 0 30px;width:30px;height:32px;padding:0;border:1.2px solid var(--border);border-radius:7px;background:#fff;font-size:12px;cursor:pointer;color:var(--muted)}
  .btn-clear:hover{border-color:#9ca3af;color:var(--text)}
  .suggest{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px;min-height:14px}
  .chip{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;color:#374151;line-height:1.4}
  .chip:hover{border-color:var(--blue);color:var(--blue);background:#eef4ff}
  .actions{margin-top:12px}
  .btn{width:100%;padding:8px 12px;border-radius:7px;border:1px solid var(--border);font-size:12.5px;font-weight:700;cursor:pointer;background:#fff}
  .btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);font-size:12.5px}
  .btn-primary:hover{background:#1557b0}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .status{margin-top:10px;font-size:11.5px;padding:7px 10px;border-radius:7px;display:none;line-height:1.4}
  .status.ok{background:#e6f4ea;color:#137333;border:1px solid #b6dfc2;display:block}
  .status.err{background:#fce8e6;color:#a50e0e;border:1px solid #f5b5b2;display:block}
  .status.loading{background:#e8f0fe;color:#174ea6;border:1px solid #c2d8ff;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head"><h1>IN PHIẾU THU CŨ</h1></div>
    <div class="body">
      <label for="maPhieuInput">Mã Phiếu <span>*</span></label>
      <div class="input-row">
        <input id="maPhieuInput" type="text" placeholder="VD: PNM0039" autocomplete="off">
        <button id="btnClear" class="btn-clear" title="Xóa">✕</button>
      </div>
      <div id="suggestBox" class="suggest"></div>
      <div class="actions">
        <button id="btnPrint" class="btn btn-primary">In phiếu</button>
      </div>
      <div id="statusBox" class="status"></div>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz9dLjloP-W6_BF-f_6nq2aROliCoxCe326PVidEZ7qm2aSvo7Et73YLISWT1lsXjkB/exec';
const PDF_URL_BASE = 'https://docs.google.com/spreadsheets/d/1nvU46bxWHOo9itAQc4I2bun3dZ6VGRAU_8BNLVUB0Eg/export?format=pdf&gid=614955341&portrait=true&size=A4&fitw=true&sheetnames=false&printtitle=false&pagenumbers=false&gridlines=false&fzr=false';
const input = document.getElementById('maPhieuInput');
const btnPrint = document.getElementById('btnPrint');
const btnClear = document.getElementById('btnClear');
const statusBox = document.getElementById('statusBox');
const suggestBox = document.getElementById('suggestBox');

(function(){
  const p = new URLSearchParams(location.search);
  const m = p.get('maPhieu') || p.get('ma_phieu') || p.get('goPrint') || p.get('MaPhieu') || p.get('code') || '';
  if(m) input.value = m;
})();
setTimeout(function(){ input.focus(); if(input.value) input.select(); }, 100);

function setStatus(msg, kind){
  if(!msg){ statusBox.style.display='none'; statusBox.textContent=''; return; }
  statusBox.textContent = msg;
  statusBox.className = 'status ' + (kind||'');
  statusBox.style.display = 'block';
}
function jsonp(url, cb){
  const s = document.createElement('script');
  const fn = '__cb_' + Date.now() + '_' + Math.floor(Math.random()*9999);
  let done=false;
  const t=setTimeout(function(){ if(done) return; done=true; try{delete window[fn];s.remove();}catch(e){} cb({ok:false,error:'Hết chờ'}); },18000);
  window[fn]=function(d){ if(done) return; done=true; clearTimeout(t); try{delete window[fn];s.remove();}catch(e){} cb(d); };
  s.onerror=function(){ if(done) return; done=true; clearTimeout(t); try{delete window[fn];s.remove();}catch(e){} cb({ok:false,error:'Không kết nối'}); };
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+fn;
  document.body.appendChild(s);
}
function loadSuggest(){
  jsonp(WEB_APP_URL + '?action=list', function(r){
    if(!r || !r.ok || !r.list || !r.list.length) return;
    suggestBox.innerHTML='';
    r.list.slice(0,10).forEach(function(ma){
      const b=document.createElement('button');
      b.type='button'; b.className='chip'; b.textContent=ma;
      b.onclick=function(){ input.value=ma; setStatus('Đã chọn ' + ma,'ok'); };
      suggestBox.appendChild(b);
    });
  });
}
loadSuggest();
btnClear.onclick = function(){ input.value=''; input.focus(); setStatus('',''); };
input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); doPrint(); } });

function openPdf(pdfUrl){
  const pdf = pdfUrl || PDF_URL_BASE;
  const a=document.createElement('a'); a.href=pdf; a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ a.remove(); window.open(pdf,'_blank'); }, 400);
}

function doPrint(){
  const ma = input.value.trim();
  if(!ma){ setStatus('Vui lòng nhập Mã Phiếu', 'err'); input.focus(); return; }
  // NÚT IN GIỜ LÀM 2 BƯỚC: 1) sync phiếu đó từ Lark về Sheet (~1s), 2) đẩy B3:C3 và mở PDF
  // Luôn hiện rõ bước đang làm để không tưởng đứng, và tăng tốc bằng /records/search chỉ lấy 1 record
  setStatus('đang sync...', 'loading');
  btnPrint.disabled = true;

  const url = WEB_APP_URL + '?action=setPrint&maPhieu=' + encodeURIComponent(ma) + '&t=' + Date.now();
  // Dùng JSONP để lấy pdfUrl chính xác; beacon Image cũ bị chặn redirect trên Github -> bỏ
  jsonp(url, function(r){
    btnPrint.disabled = false;
    if(!r || !r.ok){
      // Nếu syncOne thất bại (ví dụ base chưa hỗ trợ search) vẫn cho in bằng data cũ trong Mirror
      setStatus('Lỗi sync: ' + (r&&r.error||'không rõ') + ' — thử in bằng dữ liệu cũ', 'err');
      // vẫn đẩy B3:C3 và mở PDF bằng beacon Image fallback
      const beacon = new Image();
      beacon.src = WEB_APP_URL + '?action=setPrint&maPhieu=' + encodeURIComponent(ma) + '&t=' + Date.now();
      setTimeout(function(){ setStatus('đang in','ok'); openPdf(r&&r.pdfUrl||PDF_URL_BASE); }, 800);
      return;
    }
    setStatus('đang in','ok');
    openPdf(r.pdfUrl);
  });
}
btnPrint.onclick = doPrint;
</script>
</body>
</html>
