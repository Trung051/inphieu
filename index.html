<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>In Phiếu Thu Cũ</title>
<style>
:root{--blue:#1a73e8;--bg:#f4f6f8;--card:#fff;--border:#e0e3e7;--text:#1f2937;--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:360px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden}
.head{background:var(--blue);color:#fff;padding:10px 14px;text-align:center}
.head h1{font-size:13px;font-weight:700;letter-spacing:.3px}
.body{padding:14px}
label{font-size:11px;font-weight:600;display:block;margin-bottom:5px}
label span{color:#d93025}
.input-row{display:flex;gap:6px}
input[type=text]{flex:1;padding:7px 10px;border:1.2px solid var(--border);border-radius:7px;font-size:12.5px;outline:none;background:#fff}
input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,115,232,.12)}
input::placeholder{color:#9ca3af;font-size:12px}
.btn-clear{flex:0 0 30px;width:30px;height:32px;padding:0;border:1.2px solid var(--border);border-radius:7px;background:#fff;font-size:12px;cursor:pointer;color:var(--muted)}
.actions{margin-top:12px}
.btn{width:100%;padding:8px 12px;border-radius:7px;border:1px solid var(--border);font-size:12.5px;font-weight:700;cursor:pointer;background:#fff}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:10px;font-size:11.5px;padding:7px 10px;border-radius:7px;display:none;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.status.ok{background:#e6f4ea;color:#137333;border:1px solid #b6dfc2;display:block}
.status.err{background:#fce8e6;color:#a50e0e;border:1px solid #f5b5b2;display:block}
.status.loading{background:#e8f0fe;color:#174ea6;border:1px solid #c2d8ff;display:block}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="head"><h1>IN PHIẾU THU CŨ</h1></div>
<div class="body">
<label for="maPhieuInput">Mã Phiếu <span>*</span></label>
<div class="input-row">
<input id="maPhieuInput" type="text" placeholder="VD: PNM0039" autocomplete="off">
<button id="btnClear" class="btn-clear" title="Xóa">✕</button>
</div>
<div class="actions">
<button id="btnPrint" class="btn btn-primary">In phiếu</button>
</div>
<div id="statusBox" class="status"></div>
</div>
</div>
</div>
<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbz9dLjloP-W6_BF-f_6nq2aROliCoxCe326PVidEZ7qm2aSvo7Et73YLISWT1lsXjkB/exec';
const PDF_URL_BASE='https://docs.google.com/spreadsheets/d/1nvU46bxWHOo9itAQc4I2bun3dZ6VGRAU_8BNLVUB0Eg/export?format=pdf&gid=614955341&portrait=true&size=A4&fitw=true&sheetnames=false&printtitle=false&pagenumbers=false&gridlines=false&fzr=false';
const input=document.getElementById('maPhieuInput'),btnPrint=document.getElementById('btnPrint'),btnClear=document.getElementById('btnClear'),statusBox=document.getElementById('statusBox');
(function(){ const p=new URLSearchParams(location.search); const m=p.get('maPhieu')||p.get('ma_phieu')||p.get('goPrint')||p.get('MaPhieu')||p.get('code')||''; if(m) input.value=m;})();
setTimeout(function(){input.focus(); if(input.value) input.select();},80);
function setStatus(m,k){ if(!m){statusBox.style.display='none';statusBox.textContent='';return;} statusBox.textContent=m; statusBox.className='status '+(k||''); statusBox.style.display='block'; }

function parsePayload(txt){
  txt=String(txt||'').trim();
  try{ return JSON.parse(txt); }catch(e){}
  var m=txt.match(/^[_\w$]+\(([\s\S]*)\)\s*;?\s*$/);
  if(m){ try{ return JSON.parse(m[1]); }catch(e2){} }
  throw new Error('Phản hồi không phải JSON');
}

// CHỈ 1 request (tránh bắn 4 lần sync song song → GAS treo/timeout)
function callWebApp(url,cb,opts){
  opts=opts||{};
  var settled=false;
  function finish(data){
    if(settled) return;
    settled=true;
    try{ cb(data); }catch(e){ console.error(e); }
  }
  function viaJsonp(failToBeacon){
    var s=document.createElement('script');
    var fn='__cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
    var t=setTimeout(function(){
      try{delete window[fn];s.remove();}catch(e){}
      if(failToBeacon) beaconThenFinish();
      else finish({ok:false,error:'Hết chờ JSONP'});
    }, opts.timeoutMs||45000);
    window[fn]=function(d){
      clearTimeout(t);
      try{delete window[fn];s.remove();}catch(e){}
      if(d) finish(d);
      else if(failToBeacon) beaconThenFinish();
    };
    s.onerror=function(){
      clearTimeout(t);
      try{delete window[fn];s.remove();}catch(e){}
      if(failToBeacon) beaconThenFinish();
      else finish({ok:false,error:'JSONP lỗi\n'+WEB_APP_URL});
    };
    s.referrerPolicy='no-referrer';
    s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+encodeURIComponent(fn);
    document.body.appendChild(s);
  }
  function beaconThenFinish(){
    // chỉ khi fetch+JSONP fail — gửi 1 beacon rồi mở PDF (server vẫn chạy)
    try{ new Image().src=url+(url.indexOf('?')>-1?'&':'?')+'_beacon=1'; }catch(e){}
    finish({ok:true,pdfUrl:PDF_URL_BASE,sync:{ok:true,mode:'beacon'},_note:'Đã gửi sync (beacon), đang mở PDF'});
  }

  var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  var abortT=setTimeout(function(){ try{if(ctrl)ctrl.abort();}catch(e){} }, opts.timeoutMs||45000);
  fetch(url,{method:'GET',redirect:'follow',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:ctrl?ctrl.signal:undefined})
    .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.text(); })
    .then(function(txt){ clearTimeout(abortT); finish(parsePayload(txt)); })
    .catch(function(){
      clearTimeout(abortT);
      // fetch fail (CORS/github.io) → thử JSONP 1 lần
      viaJsonp(!!opts.allowBeaconSuccess);
    });
}

btnClear.onclick=function(){input.value='';input.focus();setStatus('','');};
input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doPrint();}});
function openPdf(p){
  var pdf=p||PDF_URL_BASE;
  var a=document.createElement('a');
  a.href=pdf; a.target='_blank'; a.rel='noopener noreferrer';
  document.body.appendChild(a); a.click(); a.remove();
}
function doPrint(){
  var ma=input.value.trim();
  if(!ma){setStatus('Vui lòng nhập Mã Phiếu','err');input.focus();return;}
  setStatus('đang sync hôm nay + ghi B3...','loading');
  btnPrint.disabled=true;
  var url=WEB_APP_URL+'?action=syncAndPrint&maPhieu='+encodeURIComponent(ma)+'&t='+Date.now();
  callWebApp(url,function(r){
    btnPrint.disabled=false;
    if(!r||r.ok===false){
      var msg='Lỗi: '+(r&&r.error||'Hết chờ')+'\nDeploy New version (Anyone) rồi thử lại';
      setStatus(msg,'err');
      setTimeout(function(){ openPdf(PDF_URL_BASE); },1500);
      return;
    }
    var s=r.sync||{};
    var n=s.total!=null?s.total:null;
    if(r._note) setStatus(r._note,'loading');
    else if(s.ok===false) setStatus('sync ngày lỗi: '+(s.error||'?')+' — vẫn ghi B3 + in','err');
    else if(s.skipped) setStatus('B3='+ma+' · hôm nay không mới — mở PDF','ok');
    else setStatus('B3='+ma+(n!=null?' · sync '+n+' phiếu':'')+' — mở PDF','ok');
    setTimeout(function(){ openPdf(r.pdfUrl||PDF_URL_BASE); },400);
  },{allowBeaconSuccess:true,timeoutMs:90000});
}
btnPrint.onclick=doPrint;

setStatus('đang kiểm tra Web App...','loading');
callWebApp(WEB_APP_URL+'?action=ping&t='+Date.now(),function(r){
  if(r&&r.ok) setStatus('Web App OK'+(r.cols?' · '+r.cols+' cột':''),'ok');
  else setStatus('Web App lỗi:\n'+(r&&r.error||'?'),'err');
},{allowBeaconSuccess:false,timeoutMs:15000});
</script>
</body>
</html>
