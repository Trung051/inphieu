<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Phiếu Thu Cũ - Nhập Mã Phiếu</title>
<style>
  :root{--blue:#1a73e8;--bg:#f8f9fa;--card:#fff;--border:#dadce0;--text:#202124}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:480px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);overflow:hidden}
  .head{background:var(--blue);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
  .head .icon{width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:22px}
  .head h1{font-size:15px}
  .body{padding:20px}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
  .input-row{display:flex;gap:8px}
  input[type=text]{flex:1;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;outline:none}
  input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,115,232,.15)}
  .suggest{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;min-height:22px}
  .chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer}
  .chip:hover{border-color:var(--blue);color:var(--blue);background:#e8f0fe}
  .actions{margin-top:16px}
  .btn{width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--border);font-size:14px;font-weight:700;cursor:pointer;background:#fff}
  .btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .status{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:10px;display:none}
  .status.ok{background:#e6f4ea;color:#0d652d;border:1px solid #a8dab5;display:block}
  .status.err{background:#fce8e6;color:#b3261e;border:1px solid #f2b8b5;display:block}
  .status.loading{background:#e8f0fe;color:#174ea6;border:1px solid #aecbfa;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="icon">🖨️</div>
      <div><h1>IN PHIẾU THU CŨ</h1></div>
    </div>
    <div class="body">
      <label for="maPhieuInput">Mã Phiếu <span style="color:#d93025">*</span></label>
      <div class="input-row">
        <input id="maPhieuInput" type="text" placeholder="VD: PNM0039" autocomplete="off">
        <button id="btnClear" class="btn" style="width:auto;flex:0 0 auto;padding:10px 14px" title="Xóa">✕</button>
      </div>
      <div id="suggestBox" class="suggest"></div>
      <div class="actions">
        <button id="btnPrint" class="btn btn-primary">🖨️ In phiếu</button>
      </div>
      <div id="statusBox" class="status"></div>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz9dLjloP-W6_BF-f_6nq2aROliCoxCe326PVidEZ7qm2aSvo7Et73YLISWT1lsXjkB/exec';
const input = document.getElementById('maPhieuInput');
const btnPrint = document.getElementById('btnPrint');
const btnClear = document.getElementById('btnClear');
const statusBox = document.getElementById('statusBox');
const suggestBox = document.getElementById('suggestBox');

(function(){
  const p = new URLSearchParams(location.search);
  const m = p.get('maPhieu') || p.get('ma_phieu') || p.get('goPrint') || p.get('MaPhieu') || p.get('code') || '';
  if(m) input.value = m;
})();
setTimeout(function(){ input.focus(); if(input.value) input.select(); }, 120);

function setStatus(msg, kind){
  if(!msg){ statusBox.style.display='none'; statusBox.textContent=''; return; }
  statusBox.textContent = msg;
  statusBox.className = 'status ' + (kind||'');
  statusBox.style.display = 'block';
}
// FIX: local chạy python -m http.server thì JSONP ok, nhưng Github -> Apps Script phải dùng JSONP với ?callback=
// Lỗi "Không kết nối được" là do Apps Script chưa deploy "Bất kỳ ai (Anyone)" -> trả về trang đăng nhập, script onerror.
// Dùng fetch qua Apps Script JSON API với no-cors không đọc được callback -> phải JSONP.
function jsonp(url, cb){
  const s = document.createElement('script');
  const fn = '__cb_' + Date.now() + '_' + Math.floor(Math.random()*9999);
  let done = false;
  const timeout = setTimeout(function(){
    if(done) return; done = true;
    try{ delete window[fn]; document.body.removeChild(s);}catch(e){}
    cb({ok:false, error:'Hết thời gian chờ. Kiểm tra Web App có deploy "Bất kỳ ai" chưa: ' + WEB_APP_URL});
  }, 15000);
  window[fn] = function(d){ if(done) return; done = true; clearTimeout(timeout); try{ delete window[fn]; document.body.removeChild(s);}catch(e){} cb(d); };
  s.onerror = function(){
    if(done) return; done = true; clearTimeout(timeout);
    try{ delete window[fn]; document.body.removeChild(s);}catch(e){}
    // Thử fetch thường để lấy lỗi chi tiết hơn
    fetch(url).then(function(r){return r.text();}).then(function(t){
      cb({ok:false, error:'Không tải được JSONP. Response: ' + t.slice(0,300) + ' — Kiểm tra deploy Ai có quyền = Bất kỳ ai'});
    }).catch(function(){
      cb({ok:false, error:'Không kết nối được Apps Script. Kiểm tra deploy Ai có quyền = Bất kỳ ai. URL: ' + WEB_APP_URL});
    });
  };
  s.src = url + (url.indexOf('?')>-1?'&':'?') + 'callback=' + fn;
  document.body.appendChild(s);
}
function loadSuggest(){
  jsonp(WEB_APP_URL + '?action=list', function(r){
    if(!r || !r.ok || !r.list || !r.list.length){
      // không báo lỗi ở đây, chỉ gợi ý thôi
      return;
    }
    suggestBox.innerHTML='';
    r.list.slice(0,12).forEach(function(ma){
      const b=document.createElement('button');
      b.type='button'; b.className='chip'; b.textContent=ma;
      b.onclick=function(){ input.value=ma; setStatus('Đã chọn ' + ma,'ok'); };
      suggestBox.appendChild(b);
    });
  });
}
loadSuggest();
btnClear.onclick = function(){ input.value=''; input.focus(); setStatus('',''); };
input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); doPrint(); } });

function doPrint(){
  const ma = input.value.trim();
  if(!ma){ setStatus('Vui lòng nhập Mã Phiếu', 'err'); input.focus(); return; }
  setStatus('đang in', 'loading');
  btnPrint.disabled = true;
  const url = WEB_APP_URL + '?action=setPrint&maPhieu=' + encodeURIComponent(ma);
  jsonp(url, function(r){
    btnPrint.disabled = false;
    if(!r || !r.ok){ setStatus('Lỗi: ' + (r&&r.error||'Không điền được B3:C3 — thử mở ' + WEB_APP_URL + '?action=ping xem có đăng nhập không'), 'err'); return; }
    setStatus('đang in', 'ok');
    // Vào thẳng chế độ in HTML A4 (đã điền B3:C3 trên In phiếu thu máy) — không qua Sheet
    const printUrl = r.printUrl || (WEB_APP_URL + '?page=print&maPhieu=' + encodeURIComponent(ma));
    // Mở trong iframe ẩn cũng được nhưng popup blocker sẽ chặn nếu không phải click trực tiếp -> dùng window.open ngay sau jsonp callback vẫn ok vì cùng tick user
    const win = window.open(printUrl, '_blank');
    if(!win){
      setStatus('Popup bị chặn! Hãy cho phép popup cho ' + location.host + ' rồi bấm In lại', 'err');
    }
  });
}
btnPrint.onclick = doPrint;
</script>
</body>
</html>
